{% load static %}

    <div class="container footer-content">
        <div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                <img src="{% static 'images/logo.svg' %}" alt="" width="28" height="28" aria-hidden="true" style="border-radius: 6px;">
                <strong style="color: #ffffff; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em;">FoodFlow</strong>
            </div>
            <p style="color: #c4d4cc; font-size: 0.875rem; max-width: 480px; margin: 0; line-height: 1.6;">

            </p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.875rem; text-align: right;">
            <div style="color: #c4e4d4; font-weight: 600;">
                Safe &bull; Verified &bull; Expiry-Tracked &bull; Zero Waste
            </div>
            <div style="color: #9cb3a7;">
                &copy; {% now "Y" %} FoodFlow Platform. All rights reserved.
            </div>
        </div>
    </div>
</footer>
